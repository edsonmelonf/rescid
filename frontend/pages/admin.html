<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESCID — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    body {
      font-family: 'Sora', sans-serif;
      background: #d0d8e4;
      display: flex;
      min-height: 100vh;
    }
 
    /* ───── SIDEBAR BOLHA ───── */
    .sidebar {
      width: 220px;
      min-height: calc(100vh - 32px);
      background: rgba(30,58,95,0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(30,58,95,0.15);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      padding: 20px 12px;
      position: fixed;
      top: 16px; left: 16px;
      z-index: 100;
      transition: width 0.3s ease;
      overflow: hidden;
    }
 
    .sidebar.collapsed { width: 60px; }
 
    .sidebar-logo {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 10px 18px;
      border-bottom: 1px solid rgba(30,58,95,0.12);
      margin-bottom: 10px;
      white-space: nowrap;
    }
 
    .logo-icon {
      width: 32px; height: 32px;
      background: #0ea5e9; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 14px; font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(14,165,233,0.35);
    }
 
    .logo-text {
      font-size: 15px; font-weight: 700;
      color: #1e3a5f; letter-spacing: 1px;
      transition: opacity 0.2s;
    }
 
    .sidebar.collapsed .logo-text { opacity: 0; pointer-events: none; }
 
    nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
 
    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 10px 12px; border-radius: 12px;
      color: #4a6a8a; text-decoration: none;
      font-size: 13px; font-weight: 500;
      white-space: nowrap;
      transition: background 0.18s, color 0.18s;
    }
 
    .nav-item:hover { background: rgba(14,165,233,0.12); color: #1e3a5f; }
 
    .nav-item.active {
      background: rgba(14,165,233,0.2);
      border: 1px solid rgba(14,165,233,0.35);
      color: #1e3a5f; font-weight: 600;
    }
 
    .nav-icon {
      width: 20px; height: 20px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
 
    .sidebar.collapsed .nav-label { opacity: 0; pointer-events: none; }
 
    .collapse-btn {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 50%;
      color: #8aa8c8; cursor: pointer;
      background: rgba(30,58,95,0.08);
      border: 1px solid rgba(30,58,95,0.12);
      font-size: 13px;
      margin: 8px auto 0;
      transition: background 0.18s, color 0.18s, transform 0.3s;
      flex-shrink: 0;
    }
 
    .collapse-btn:hover { background: rgba(14,165,233,0.15); color: #1e3a5f; }
    .sidebar.collapsed .collapse-btn { transform: rotate(180deg); }
 
    .sidebar-profile {
      display: flex; align-items: center; gap: 9px;
      padding: 12px 10px 4px;
      border-top: 1px solid rgba(30,58,95,0.12);
      margin-top: 8px; white-space: nowrap;
    }
 
    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: #0ea5e9; color: #fff;
      font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(14,165,233,0.3);
    }
 
    .profile-name {
      font-size: 12px; font-weight: 600;
      color: #1e3a5f; transition: opacity 0.2s;
    }
 
    .sidebar.collapsed .profile-name { opacity: 0; pointer-events: none; }
 
    /* ───── MAIN ───── */
    .main-wrapper {
      margin-left: calc(220px + 32px);
      margin-right: 16px;
      margin-top: 16px;
      margin-bottom: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      transition: margin-left 0.3s ease;
    }
 
    .main-wrapper.expanded { margin-left: calc(60px + 32px); }
 
    /* TOPBAR */
    .topbar {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(255,255,255,0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(30,58,95,0.12);
      border-radius: 16px;
      margin-bottom: 16px;
    }
 
    .topbar-title h1 { font-size: 16px; font-weight: 700; color: #1e3a5f; }
    .topbar-title p  { font-size: 11px; color: #5a7a9a; margin-top: 1px; }
 
    .topbar-badge {
      background: rgba(14,165,233,0.15);
      border: 1px solid rgba(14,165,233,0.25);
      color: #0369a1;
      font-size: 12px; font-weight: 600;
      padding: 6px 14px; border-radius: 20px;
    }
 
    /* ───── GRID ───── */
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 16px;
      flex: 1;
    }
 
    /* ───── CARD BOLHA ───── */
    .glass-card {
      background: rgba(255,255,255,0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(30,58,95,0.12);
      border-radius: 18px;
      padding: 24px;
    }
 
    .glass-card h2 {
      font-size: 15px; font-weight: 700;
      color: #1e3a5f; margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(30,58,95,0.1);
    }
 
    /* ───── FORMULÁRIO ───── */
    .form-group {
      display: flex; flex-direction: column; gap: 12px;
    }
 
    .form-group input,
    .form-group textarea,
    .form-group select {
      padding: 11px 14px;
      border-radius: 10px;
      border: 1.5px solid rgba(30,58,95,0.15);
      background: rgba(255,255,255,0.6);
      font-family: inherit; font-size: 13px; color: #1e3a5f;
      outline: none;
      transition: border 0.2s, background 0.2s;
    }
 
    .form-group input::placeholder,
    .form-group textarea::placeholder { color: #8aa8c8; }
 
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #0ea5e9;
      background: rgba(255,255,255,0.9);
    }
 
    .form-group textarea {
      resize: vertical; min-height: 90px;
    }
 
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
 
    .form-label {
      font-size: 11px; font-weight: 600;
      color: #5a7a9a; margin-bottom: -6px;
    }
 
    .btn-save {
      width: 100%; padding: 13px;
      border-radius: 10px; border: none;
      background: #0ea5e9; color: #fff;
      font-family: inherit; font-size: 14px; font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(14,165,233,0.3);
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 4px;
    }
 
    .btn-save:hover { opacity: 0.88; transform: translateY(-1px); }
 
    /* ───── LISTA DE AÇÕES ───── */
    .actions-list {
      display: flex; flex-direction: column; gap: 10px;
      max-height: 520px; overflow-y: auto;
      padding-right: 4px;
    }
 
    .actions-list::-webkit-scrollbar { width: 5px; }
    .actions-list::-webkit-scrollbar-track { background: transparent; }
    .actions-list::-webkit-scrollbar-thumb { background: rgba(30,58,95,0.2); border-radius: 10px; }
 
    .admin-item {
      background: rgba(255,255,255,0.5);
      border: 1px solid rgba(30,58,95,0.1);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      transition: box-shadow 0.2s;
    }
 
    .admin-item:hover { box-shadow: 0 4px 16px rgba(30,58,95,0.1); }
 
    .item-info h3 { font-size: 13px; font-weight: 700; color: #1e3a5f; margin-bottom: 3px; }
    .item-info p  { font-size: 12px; color: #5a7a9a; }
    .item-info .item-meta {
      display: flex; gap: 10px; margin-top: 6px;
    }
    .item-info .item-meta span {
      font-size: 11px; color: #8aa8c8;
    }
 
    .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
 
    .btn-icon {
      width: 32px; height: 32px; border-radius: 8px;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      transition: background 0.18s;
    }
 
    .btn-edit {
      background: rgba(14,165,233,0.12);
      color: #0369a1;
    }
    .btn-edit:hover { background: rgba(14,165,233,0.25); }
 
    .btn-delete {
      background: rgba(239,68,68,0.1);
      color: #dc2626;
    }
    .btn-delete:hover { background: rgba(239,68,68,0.22); }
 
    .empty-list {
      text-align: center; padding: 32px 0;
      font-size: 13px; color: #8aa8c8;
    }
 
    @media (max-width: 900px) {
      .admin-grid { grid-template-columns: 1fr; }
    }
 
    @media (max-width: 580px) {
      .sidebar { display: none; }
      .main-wrapper, .main-wrapper.expanded { margin-left: 16px; }
    }
  </style>
</head>
<body>
 
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">R</div>
      <span class="logo-text">RESCID</span>
    </div>
    <nav>
      <a href="index.html" class="nav-item">
        <span class="nav-icon">🤝</span>
        <span class="nav-label">Ações</span>
      </a>
      <a href="#" class="nav-item">
        <span class="nav-icon">💝</span>
        <span class="nav-label">Doação</span>
      </a>
      <a href="#" class="nav-item">
        <span class="nav-icon">⭐</span>
        <span class="nav-label">Patrocinadores</span>
      </a>
      <a href="login.html" class="nav-item active">
        <span class="nav-icon">🛡️</span>
        <span class="nav-label">Área Admin</span>
      </a>
    </nav>
    <button class="collapse-btn" onclick="toggleSidebar()">◀</button>
    <div class="sidebar-profile">
      <div class="avatar">A</div>
      <span class="profile-name">Admin</span>
    </div>
  </aside>
 
  <!-- MAIN -->
  <div class="main-wrapper" id="mainWrapper">
 
    <header class="topbar">
      <div class="topbar-title">
        <h1>Área Administrativa</h1>
        <p>Gerencie as ações sociais cadastradas</p>
      </div>
      <span class="topbar-badge" id="totalBadge">0 ações</span>
    </header>
 
    <div class="admin-grid">
 
      <!-- FORMULÁRIO -->
      <div class="glass-card">
        <h2>📋 Cadastrar Nova Ação</h2>
        <div class="form-group">
          <span class="form-label">Título</span>
          <input type="text" id="fTitulo" placeholder="Nome da ação social" />
 
          <span class="form-label">Descrição</span>
          <textarea id="fDescricao" placeholder="Descreva a ação..."></textarea>
 
          <div class="form-row">
            <div style="display:flex;flex-direction:column;gap:6px;">
              <span class="form-label">Data</span>
              <input type="date" id="fData" />
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;">
              <span class="form-label">Local</span>
              <input type="text" id="fLocal" placeholder="Endereço ou local" />
            </div>
          </div>
 
          <span class="form-label">URL da imagem</span>
          <input type="text" id="fImagem" placeholder="https://..." />
 
          <span class="form-label">Categoria</span>
          <select id="fCategoria">
            <option value="">Selecione...</option>
            <option value="arrecadacao">Arrecadação</option>
            <option value="voluntariado">Voluntariado</option>
            <option value="educacao">Educação</option>
            <option value="saude">Saúde</option>
            <option value="doacao">Doação</option>
          </select>
 
          <button class="btn-save" onclick="salvarAcao()">Salvar Ação</button>
        </div>
      </div>
 
      <!-- LISTA -->
      <div class="glass-card">
        <h2>📌 Ações Cadastradas</h2>
        <div class="actions-list" id="actionsList">
          <div class="empty-list" id="emptyMsg">Nenhuma ação cadastrada ainda.</div>
        </div>
      </div>
 
    </div>
  </div>
 
  <script>
    // Dados de exemplo já carregados
    let acoes = [
      { id: 1, titulo: 'Campanha de Arrecadação', descricao: 'Ajude famílias em situação de vulnerabilidade.', data: '2026-05-09', local: 'Centro Comunitário', categoria: 'arrecadacao' },
      { id: 2, titulo: 'Mutirão de Voluntários', descricao: 'Revitalização do parque municipal.', data: '2026-05-15', local: 'Parque Municipal', categoria: 'voluntariado' },
      { id: 3, titulo: 'Aulas de Reforço Escolar', descricao: 'Reforço gratuito para crianças.', data: '2026-05-20', local: 'Escola Municipal', categoria: 'educacao' },
    ];
 
    function renderList() {
      const list = document.getElementById('actionsList');
      const empty = document.getElementById('emptyMsg');
      const badge = document.getElementById('totalBadge');
 
      badge.textContent = `${acoes.length} ação${acoes.length !== 1 ? 'ões' : ''}`;
 
      if (acoes.length === 0) {
        list.innerHTML = '<div class="empty-list" id="emptyMsg">Nenhuma ação cadastrada ainda.</div>';
        return;
      }
 
      list.innerHTML = acoes.map(a => `
        <div class="admin-item">
          <div class="item-info">
            <h3>${a.titulo}</h3>
            <p>${a.descricao}</p>
            <div class="item-meta">
              <span>📅 ${formatDate(a.data)}</span>
              <span>📍 ${a.local}</span>
            </div>
          </div>
          <div class="item-actions">
            <button class="btn-icon btn-edit" onclick="editarAcao(${a.id})" title="Editar">✏️</button>
            <button class="btn-icon btn-delete" onclick="excluirAcao(${a.id})" title="Excluir">🗑️</button>
          </div>
        </div>
      `).join('');
    }
 
    function salvarAcao() {
      const titulo    = document.getElementById('fTitulo').value.trim();
      const descricao = document.getElementById('fDescricao').value.trim();
      const data      = document.getElementById('fData').value;
      const local     = document.getElementById('fLocal').value.trim();
      const imagem    = document.getElementById('fImagem').value.trim();
      const categoria = document.getElementById('fCategoria').value;
 
      if (!titulo || !descricao || !data || !local) {
        alert('Preencha pelo menos título, descrição, data e local.');
        return;
      }
 
      acoes.push({ id: Date.now(), titulo, descricao, data, local, imagem, categoria });
 
      // Limpa o formulário
      ['fTitulo','fDescricao','fData','fLocal','fImagem'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('fCategoria').value = '';
 
      renderList();
    }
 
    function excluirAcao(id) {
      if (!confirm('Tem certeza que deseja excluir esta ação?')) return;
      acoes = acoes.filter(a => a.id !== id);
      renderList();
    }
 
    function editarAcao(id) {
      const a = acoes.find(a => a.id === id);
      if (!a) return;
      document.getElementById('fTitulo').value    = a.titulo;
      document.getElementById('fDescricao').value = a.descricao;
      document.getElementById('fData').value      = a.data;
      document.getElementById('fLocal').value     = a.local;
      document.getElementById('fImagem').value    = a.imagem || '';
      document.getElementById('fCategoria').value = a.categoria || '';
      acoes = acoes.filter(x => x.id !== id);
      renderList();
      document.getElementById('fTitulo').focus();
    }
 
    function formatDate(d) {
      if (!d) return '—';
      const [y, m, dia] = d.split('-');
      return `${dia}/${m}/${y}`;
    }
 
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
      document.getElementById('mainWrapper').classList.toggle('expanded');
    }
 
    renderList();
  </script>
 
</body>
</html>
